<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Ajustes')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>

<div class="p-4">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <h2>Ajustes</h2>

    <form th:action="@{/ajustes}" th:object="${form}" method="post" class="mt-4" style="max-width: 800px;">

        <div class="card mb-3">
            <div class="card-header">Datos de la AMPA</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombreAmpa}" class="form-control">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">CIF</label>
                        <input type="text" th:field="*{cifAmpa}" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Telefono</label>
                        <input type="text" th:field="*{telefonoAmpa}" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Direccion</label>
                    <input type="text" th:field="*{direccionAmpa}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{emailAmpa}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Cuenta bancaria</label>
                    <input type="text" th:field="*{cuentaAmpa}" class="form-control">
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Cuotas y descuentos</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cuota anual de socio (EUR)</label>
                        <input type="number" step="0.01" th:field="*{cuotaSocio}" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Descuento socio global (%)</label>
                        <input type="number" step="0.01" th:field="*{descuentoSocioGlobal}" class="form-control">
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">IVA (opcional)</div>
            <div class="card-body">
                <div class="form-check mb-3">
                    <input type="checkbox" th:field="*{ivaActivado}" class="form-check-input">
                    <label class="form-check-label">Aplicar IVA en las actividades</label>
                </div>
                <div class="mb-3">
                    <label class="form-label">Porcentaje de IVA (%)</label>
                    <input type="number" step="0.01" th:field="*{ivaPorcentaje}" class="form-control">
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Seguridad</div>
            <div class="card-body">
                <label class="form-label">Tiempo de inactividad antes de cerrar sesion (min)</label>
                <input type="number" th:field="*{sesionTimeoutMinutos}" class="form-control" style="max-width: 200px;">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar ajustes</button>

        <div class="card mb-3">
            <div class="card-header">Categorías de gasto</div>
            <div class="card-body">
                <p class="text-muted mb-2">Gestiona las categorías que aparecen al registrar un gasto.</p>
                <a th:href="@{/ajustes/categorias-gastos}" class="btn btn-outline-primary">
                    <i class="bi bi-tags"></i> Gestionar categorías de gasto
                </a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
