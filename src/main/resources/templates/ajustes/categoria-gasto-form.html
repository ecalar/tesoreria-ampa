<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Categoría de gasto')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>

<div class="p-4">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${editando} ? 'Editar categoría' : 'Nueva categoría'"></h2>
        <a th:href="@{/ajustes/categorias-gastos}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <form th:action="${editando} ? @{'/ajustes/categorias-gastos/' + ${form.id} + '/editar'}
                                  : @{/ajustes/categorias-gastos/nueva}"
          th:object="${form}" method="post" class="mt-4" style="max-width: 700px;">

        <div class="card mb-3">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Nombre *</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
                </div>
                <div class="form-check">
                    <input type="checkbox" th:field="*{activa}" class="form-check-input" id="activa">
                    <label class="form-check-label" for="activa">Activa</label>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i>
            <span th:text="${editando} ? 'Guardar cambios' : 'Crear categoría'"></span>
        </button>
        <a th:href="@{/ajustes/categorias-gastos}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
