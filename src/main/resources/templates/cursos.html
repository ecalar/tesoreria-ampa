<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Cursos')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>

<div class="p-4">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <h2>Cursos escolares</h2>

    <div class="card mt-4 mb-4">
        <div class="card-header">Crear nuevo curso</div>
        <div class="card-body">
            <form th:action="@{/cursos/crear}" method="post" class="row g-2">
                <div class="col-md-4">
                    <input type="text" name="nombre" placeholder="Ej: 2025-2026" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <input type="date" name="fechaInicio" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <input type="date" name="fechaFin" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-hover">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Inicio</th>
            <th>Fin</th>
            <th>Estado</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${cursos}">
            <td th:text="${c.nombre}"></td>
            <td th:text="${#temporals.format(c.fechaInicio, 'dd/MM/yyyy')}"></td>
            <td th:text="${#temporals.format(c.fechaFin, 'dd/MM/yyyy')}"></td>
            <td>
                <span th:if="${c.estado.name() == 'ABIERTO'}" class="badge bg-success">ABIERTO</span>
                <span th:if="${c.estado.name() == 'CERRADO'}" class="badge bg-secondary">CERRADO</span>
            </td>
            <td>
                <form th:if="${c.estado.name() == 'ABIERTO'}"
                      th:action="@{'/cursos/cerrar/' + ${c.id}}" method="post" class="d-inline"
                      onsubmit="return confirm('Cerrar el curso? Se generará un backup automático y no se podrá editar.');">
                    <button type="submit" class="btn btn-sm btn-outline-warning">
                        <i class="bi bi-lock"></i> Cerrar
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(cursos)}">
            <td colspan="5" class="text-center text-muted py-4">No hay cursos creados aun.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
