<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Inscripcion escuela')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>

<div class="p-4">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 th:text="${editando} ? 'Editar inscripcion' : 'Inscribir alumno'"></h2>
    <p class="text-muted">
        Escuela: <strong th:text="${actividad.nombre}"></strong>
    </p>

    <form th:action="${editando} ? @{'/escuelas/' + ${actividad.id} + '/inscripciones/' + ${form.id} + '/editar'}
                                  : @{'/escuelas/' + ${actividad.id} + '/inscripciones/nueva'}"
          th:object="${form}" method="post" class="mt-4" style="max-width: 800px;">

        <div class="card mb-3">
            <div class="card-header">Datos de la inscripcion</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Alumno *</label>
                    <select th:field="*{alumnoId}" class="form-select" required th:disabled="${editando}">
                        <option value="">-- Selecciona un alumno --</option>
                        <option th:each="a : ${alumnos}"
                                th:value="${a.id}"
                                th:text="${a.nombreCompleto + ' (' + (a.curso != null ? a.curso : 'sin curso') + (a.socio != null ? '' : ' - NO SOCIO') + ')'}"
                                th:selected="${form.alumnoId != null and form.alumnoId == a.id}"></option>
                    </select>
                    <input th:if="${editando}" type="hidden" th:field="*{alumnoId}">
                    <div th:unless="${editando}" class="mt-2">
                        <a th:href="@{/alumnos/nuevo-no-socio(returnTo=${returnTo})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-person-plus"></i> Anadir alumno no socio
                        </a>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Modalidad *</label>
                    <select th:field="*{modalidad}" id="modalidadSelect" class="form-select" required>
                        <option th:each="m : ${modalidades}"
                                th:value="${m}"
                                th:text="${m.name()}"></option>
                    </select>
                    <small class="text-muted">
                        COMPLETO = mes entero · MEDIO = medio mes · POR_DIAS = solo los dias elegidos
                    </small>
                </div>

                <!-- Bloque POR_DIAS (solo visible si se elige POR_DIAS) -->
                <div id="bloquePorDias" style="display:none;">
                    <div class="mb-3">
                        <label class="form-label">Numero de dias al mes *</label>
                        <input type="number" min="1" max="31" th:field="*{diasAsistidos}" class="form-control">
                        <small class="text-muted">Ej: si va 3 dias a la semana durante 4 semanas, son 12 dias.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dias concretos (opcional)</label>
                        <input type="text" th:field="*{diasSemanaSeleccionados}" class="form-control"
                               placeholder="Ej: L,M,X o 1,3,5">
                        <small class="text-muted">Solo informativo para organizar la escuela.</small>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" th:field="*{permisoImagen}" class="form-check-input" id="permisoImg">
                    <label class="form-check-label" for="permisoImg">
                        Autoriza imagenes para esta escuela
                    </label>
                </div>

                <div class="mb-3">
                    <label class="form-label">Observaciones</label>
                    <textarea th:field="*{observaciones}" class="form-control" rows="3"></textarea>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> <span th:text="${editando} ? 'Guardar cambios' : 'Inscribir'"></span>
        </button>
        <a th:href="@{'/escuelas/' + ${actividad.id}}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>

<script>
    (function() {
        var sel = document.getElementById('modalidadSelect');
        var bloque = document.getElementById('bloquePorDias');
        function actualizar() {
            if (sel.value === 'POR_DIAS') {
                bloque.style.display = 'block';
            } else {
                bloque.style.display = 'none';
            }
        }
        if (sel) {
            sel.addEventListener('change', actualizar);
            actualizar();
        }
    })();
</script>
</body>
</html>
