<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Actividad extra')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>

<div class="p-4">
    <div class="mb-3">
    </div>
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <a th:href="@{/extras/actividades}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Volver </a>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${actividad.nombre}"></h2>
        <div>
            <a th:href="@{'/extras/actividades/' + ${actividad.id} + '/editar'}"
               class="btn btn-outline-secondary">
                <i class="bi bi-pencil"></i> Editar
            </a>
            <form th:action="@{'/extras/actividades/' + ${actividad.id} + '/borrar'}"
                  method="post" class="d-inline"
                  onsubmit="return confirm('Borrar esta actividad? Solo es posible si no tiene inscritos activos.');">
                <button type="submit" class="btn btn-outline-danger">
                    <i class="bi bi-trash"></i> Borrar
                </button>
            </form>
            <a th:href="@{/extras/actividades}" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>

    <!-- Datos de la actividad -->
    <div class="card mb-4">
        <div class="card-header">Datos de la actividad extra</div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <dl class="row mb-0">
                        <dt class="col-sm-5">Periodo</dt>
                        <dd class="col-sm-7">
                            <span th:text="${#temporals.format(actividad.fechaInicio, 'dd/MM/yyyy')}"></span>
                            -
                            <span th:text="${#temporals.format(actividad.fechaFin, 'dd/MM/yyyy')}"></span>
                        </dd>
                        <dd class="col-sm-7" th:text="${actividad.horario}"></dd>
                    </dl>
                </div>
                <div class="col-md-6">
                    <dl class="row mb-0">
                        <dt class="col-sm-5">Precio completo</dt>
                        <dd class="col-sm-7"
                            th:text="${#numbers.formatDecimal(actividad.precioMesCompleto, 1, 2)} + ' EUR'"></dd>
                        <dt class="col-sm-5">Precio medio</dt>
                        <dd class="col-sm-7"
                            th:text="${#numbers.formatDecimal(actividad.precioMedioMes, 1, 2)} + ' EUR'"></dd>
                        <div th:if="${actividad.precioPorDia != null}">
                            <dt class="col-sm-5">Precio por dia</dt>
                            <dd class="col-sm-7"
                                th:text="${#numbers.formatDecimal(actividad.precioPorDia, 1, 2)} + ' EUR'"></dd>
                        </div>
                        <dt class="col-sm-5">Descuento socio</dt>
                        <dd class="col-sm-7" th:text="${actividad.descuentoSocioPorcentaje} + ' %'"></dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

    <!-- Totales -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card bg-light">
                <div class="card-body py-2">
                    <small class="text-muted">Cobrado</small>
                    <h5 class="mb-0" th:text="${#numbers.formatDecimal(totalPagado, 1, 2)} + ' EUR'"></h5>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-light">
                <div class="card-body py-2">
                    <small class="text-muted">Pendiente</small>
                    <h5 class="mb-0" th:text="${#numbers.formatDecimal(totalPendiente, 1, 2)} + ' EUR'"></h5>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-light">
                <div class="card-body py-2">
                    <small class="text-muted">Inscritos</small>
                    <h5 class="mb-0" th:text="${inscripciones.size()}"></h5>
                </div>
            </div>
        </div>
    </div>

    <!-- Inscritos -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Inscritos</h4>
        <a th:href="@{'/extras/actividades/' + ${actividad.id} + '/inscripciones/nueva'}"
           class="btn btn-sm btn-primary">
            <i class="bi bi-person-plus"></i> Inscribir alumno
        </a>
    </div>

    <!-- Filtros de inscritos -->
    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{'/extras/actividades/' + ${actividad.id}}" method="get"
                  class="row g-2 align-items-end">
                <div class="col-md-6">
                    <label class="form-label">Buscar</label>
                    <input type="text" name="q" th:value="${q}" placeholder="Nombre o curso"
                           class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select">
                        <option value="">Todos</option>
                        <option th:each="e : ${estados}" th:value="${e}" th:text="${e.name()}"
                                th:selected="${estado != null and estado.name() == e.name()}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary w-100">Filtrar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Alumno</th>
                    <th>Curso</th>
                    <th>Modalidad</th>
                    <th>Dias</th>
                    <th class="text-end">Importe</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="i : ${inscripciones}">
                    <td th:text="${i.alumno.nombreCompleto}"></td>
                    <td th:text="${i.alumno.curso}"></td>
                    <td><span class="badge bg-info" th:text="${i.modalidad.name()}"></span></td>
                    <td th:text="${i.diasAsistidos != null ? i.diasAsistidos : ''}"></td>
                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(i.importeMensualCalculado, 1, 2)} + ' EUR'"></td>
                    <td>
                        <span th:if="${i.estado.name() == 'ACTIVA'}" class="badge bg-success">ACTIVA</span>
                        <span th:if="${i.estado.name() == 'BAJA'}" class="badge bg-secondary">BAJA</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/extras/actividades/' + ${actividad.id} + '/inscripciones/' + ${i.id}}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-eye"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(inscripciones)}">
                    <td colspan="7" class="text-center text-muted py-4">
                        No hay inscritos que coincidan.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
