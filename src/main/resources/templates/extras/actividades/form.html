<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Actividad extra')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>

<div class="p-4">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${editando} ? 'Editar actividad extra' : 'Nueva actividad extra'"></h2>
        <a th:href="@{/extras/actividades}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver a la lista
        </a>
    </div>

    <form th:action="${editando} ? @{'/extras/actividades/' + ${form.id} + '/editar'} : @{/extras/actividades/nueva}"
          th:object="${form}" method="post" class="mt-4" style="max-width: 900px;">

        <div class="card mb-3">
            <div class="card-header">Datos generales</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Nombre *</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripcion</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha inicio *</label>
                        <input type="date" th:field="*{fechaInicio}" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha fin *</label>
                        <input type="date" th:field="*{fechaFin}" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Horario</label>
                        <input type="text" th:field="*{horario}" class="form-control"
                               placeholder="Ej: 17:00-18:30">
                    </div>
                </div>
                <div class="form-text">
                    Para actividades que se repiten varios dias a la semana, usad el modulo Extraescolares.
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Precio y descuento</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Precio (EUR)</label>
                        <input type="number" step="0.01" min="0" th:field="*{precioMesCompleto}"
                               class="form-control">
                        <small class="text-muted">
                            Puede ser 0 si la actividad es gratuita.
                        </small>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Descuento socio (%)</label>
                        <input type="number" step="0.01" min="0" max="100"
                               th:field="*{descuentoSocioPorcentaje}"
                               class="form-control" placeholder="0">
                        <small class="text-muted">
                            Opcional. Si se deja vacio, no se aplica descuento.
                        </small>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i>
            <span th:text="${editando} ? 'Guardar cambios' : 'Crear actividad'"></span>
        </button>
        <a th:href="@{/extras/actividades}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
