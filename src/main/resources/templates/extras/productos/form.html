<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Producto')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>

<div class="p-4">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 th:text="${editando} ? 'Editar producto' : 'Nuevo producto'"></h2>

    <form th:action="${editando} ? @{'/extras/productos/' + ${form.id} + '/editar'} : @{/extras/productos/nuevo}"
          th:object="${form}" method="post" class="mt-4" style="max-width: 800px;">

        <div class="card mb-3">
            <div class="card-header">Datos del producto</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Nombre *</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripcion</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Precio unitario (EUR) *</label>
                        <input type="number" step="0.01" th:field="*{precioUnitario}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="form-check mt-4">
                            <input type="checkbox" th:field="*{activo}" class="form-check-input" id="activo">
                            <label class="form-check-label" for="activo">Producto activo</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> <span th:text="${editando} ? 'Guardar cambios' : 'Crear producto'"></span>
        </button>
        <a th:href="@{/extras/productos}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
