<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Extras')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>

<div class="p-4">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a th:href="@{/extras}" class="btn btn-outline-secondary btn-sm mb-2">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
            <h2 class="mb-0">Productos</h2>
        </div>
        <a th:href="@{/extras/productos/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Nuevo producto
        </a>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/extras/productos}" method="get" class="row g-2 align-items-end">
                <div class="col-md-9">
                    <label class="form-label">Buscar por nombre</label>
                    <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Ej: Sudadera">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-outline-primary w-100">
                        <i class="bi bi-search"></i> Filtrar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-3">
            <div class="card bg-light">
                <div class="card-body py-2">
                    <small class="text-muted">Productos</small>
                    <h5 class="mb-0" th:text="${totalProductos}"></h5>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-light">
                <div class="card-body py-2">
                    <small class="text-muted">Unidades</small>
                    <h5 class="mb-0" th:text="${totalUnidades}"></h5>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-light">
                <div class="card-body py-2">
                    <small class="text-muted">Cobrado</small>
                    <h5 class="mb-0 text-success"
                        th:text="${#numbers.formatDecimal(totalCobrado, 1, 2)} + ' EUR'"></h5>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-light">
                <div class="card-body py-2">
                    <small class="text-muted">Pendiente</small>
                    <h5 class="mb-0 text-danger"
                        th:text="${#numbers.formatDecimal(totalPendiente, 1, 2)} + ' EUR'"></h5>
                </div>
            </div>
        </div>
    </div>

    <div class="mb-3">
        <div class="btn-group">
            <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                <i class="bi bi-download"></i> Exportar listado
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" th:href="@{/extras/productos/export/listado/csv(q=${q})}">CSV</a></li>
                <li><a class="dropdown-item" th:href="@{/extras/productos/export/listado/xlsx(q=${q})}">Excel</a></li>
                <li><a class="dropdown-item" th:href="@{/extras/productos/export/listado/pdf(q=${q})}">PDF</a></li>
            </ul>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripcion</th>
                    <th class="text-end">Precio</th>
                    <th class="text-center">Activo</th>
                    <th class="text-center">Pedidos</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td>
                        <a th:href="@{'/extras/productos/' + ${p.id}}" th:text="${p.nombre}"></a>
                    </td>
                    <td th:text="${p.descripcion}"></td>
                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(p.precioUnitario, 1, 2)} + ' EUR'"></td>
                    <td class="text-center">
                        <span th:if="${p.activo}" class="badge bg-success">SI</span>
                        <span th:unless="${p.activo}" class="badge bg-secondary">NO</span>
                    </td>
                    <td class="text-center" th:text="${p.pedidos.size()}"></td>
                    <td class="text-end">
                        <a th:href="@{'/extras/' + ${p.id}}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{'/extras/productos/' + ${p.id} + '/editar'}"
                           class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        No hay productos.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
