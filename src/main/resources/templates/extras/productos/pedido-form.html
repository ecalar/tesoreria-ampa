<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Pedido')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>

<div class="p-4">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 th:text="${editando} ? 'Editar pedido' : 'Nuevo pedido'"></h2>
    <p class="text-muted">
        Producto: <strong th:text="${producto.nombre}"></strong>
        (<span th:text="${#numbers.formatDecimal(producto.precioUnitario, 1, 2)}"></span> EUR / ud)
    </p>

    <form th:action="${editando} ? @{'/extras/productos/' + ${producto.id} + '/pedidos/' + ${form.id} + '/editar'} : @{'/extras/productos/' + ${producto.id} + '/pedidos/nuevo'}"
          th:object="${form}" method="post" class="mt-4" style="max-width: 800px;">

        <div class="card mb-3">
            <div class="card-header">Datos del pedido</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Alumno *</label>
                    <select th:field="*{alumnoId}" class="form-select" required th:disabled="${editando}">
                        <option value="">-- Selecciona un alumno --</option>
                        <option th:each="a : ${alumnos}"
                                th:value="${a.id}"
                                th:text="${a.nombreCompleto + ' (' + (a.curso != null ? a.curso : 'sin curso') + (a.socio != null ? '' : ' - NO SOCIO') + ')'}"
                                th:selected="${form.alumnoId != null and form.alumnoId == a.id}"></option>
                    </select>
                    <input th:if="${editando}" type="hidden" th:field="*{alumnoId}">
                    <div th:unless="${editando}" class="mt-2">
                        <a th:href="@{/alumnos/nuevo-no-socio(returnTo=${returnTo})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-person-plus"></i> Anadir alumno no socio
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Cantidad *</label>
                        <input type="number" min="1" th:field="*{cantidad}" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Talla</label>
                        <input type="text" th:field="*{talla}" class="form-control" placeholder="Ej: 8, M, L">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Metodo de pago *</label>
                        <select th:field="*{metodoPago}" class="form-select" required>
                            <option th:each="m : ${metodosPago}" th:value="${m}" th:text="${m.name()}"></option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Observaciones</label>
                    <textarea th:field="*{observaciones}" class="form-control" rows="2"></textarea>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> <span th:text="${editando} ? 'Guardar cambios' : 'Crear pedido'"></span>
        </button>
        <a th:href="@{'/extras/productos/' + ${producto.id}}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
