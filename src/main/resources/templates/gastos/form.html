<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Gasto')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>

<div class="p-4">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${editando} ? 'Editar gasto' : 'Nuevo gasto'"></h2>
        <a th:href="@{/gastos}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <form th:action="${editando} ? @{'/gastos/' + ${form.id} + '/editar'} : @{/gastos/nuevo}"
          th:object="${form}" method="post" enctype="multipart/form-data"
          class="mt-4" style="max-width: 800px;">

        <div class="card mb-3">
            <div class="card-header">Datos del gasto</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Concepto *</label>
                    <input type="text" th:field="*{concepto}" class="form-control" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Categoría</label>
                        <select th:field="*{categoriaId}" class="form-select">
                            <option value="">-- Sin categoría --</option>
                            <option th:each="c : ${categorias}"
                                    th:value="${c.id}"
                                    th:text="${c.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Proveedor</label>
                        <input type="text" th:field="*{proveedor}" class="form-control">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Importe base (EUR) *</label>
                        <input type="number" step="0.01" min="0" th:field="*{importeBase}"
                               class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">IVA (%)</label>
                        <input type="number" step="0.01" min="0" max="100"
                               th:field="*{ivaPorcentaje}" class="form-control"
                               placeholder="0">
                        <small class="text-muted">0 si no tiene IVA</small>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha *</label>
                        <input type="date" th:field="*{fecha}" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Método de pago *</label>
                        <select th:field="*{metodoPago}" class="form-select" required>
                            <option th:each="m : ${metodosPago}" th:value="${m}" th:text="${m.name()}"></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Factura adjunta</div>
            <div class="card-body">
                <div th:if="${editando and form.nombreFacturaOriginalActual != null}" class="mb-3">
                    <label class="form-label">Factura actual</label>
                    <div>
                        <a th:href="@{'/gastos/' + ${form.id} + '/factura'}"
                           target="_blank" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-file-earmark-text"></i>
                            <span th:text="${form.nombreFacturaOriginalActual}"></span>
                        </a>
                    </div>
                    <small class="text-muted">Si subes una nueva factura, se reemplazará la actual.</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Subir factura (PDF, JPG, PNG...)</label>
                    <input type="file" th:field="*{factura}" class="form-control" accept=".pdf,.jpg,.jpeg,.png">
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Observaciones</div>
            <div class="card-body">
                <textarea th:field="*{observaciones}" class="form-control" rows="3"></textarea>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i>
            <span th:text="${editando} ? 'Guardar cambios' : 'Crear gasto'"></span>
        </button>
        <a th:href="@{/gastos}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
