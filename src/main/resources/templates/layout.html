<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title} + ' - Tesoreria AMPA'">Tesoreria AMPA</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <style>
        body {
            min-height: 100vh;
            padding-left: 240px;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100vh;
            overflow-y: auto;
            background: #1e3a5f;
            z-index: 100;
        }
        .sidebar a {
            color: #cfd8e3;
            text-decoration: none;
            padding: 0.6rem 1rem;
            display: block;
            border-radius: 0.3rem;
            margin: 0.15rem 0.5rem;
        }
        .sidebar a:hover, .sidebar a.active {
            background: #2c5282;
            color: #fff;
        }
        .sidebar .brand {
            color: #fff;
            font-weight: bold;
            padding: 1rem;
            font-size: 1.1rem;
            border-bottom: 1px solid #2c5282;
            margin-bottom: 1rem;
        }
        .sidebar .section-title {
            color: #8ba5c9;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            margin-top: 0.5rem;
        }
        .top-bar {
            background: #fff;
            border-bottom: 1px solid #dee2e6;
        }
    </style>
</head>
<body>

<div th:fragment="sidebar">
    <aside class="sidebar">
        <div class="brand">
            <i class="bi bi-piggy-bank"></i> Tesoreria AMPA
        </div>

        <a th:href="@{/}"><i class="bi bi-house"></i> Inicio</a>

        <div class="section-title">Ingresos</div>
        <a th:href="@{/socios}"><i class="bi bi-people"></i> Socios</a>
        <a th:href="@{/extraescolares}"><i class="bi bi-calendar-week"></i> Extraescolares</a>
        <a th:href="@{/escuelas}"><i class="bi bi-mortarboard"></i> Escuelas</a>
        <a th:href="@{/extras}"><i class="bi bi-bag"></i> Extras</a>
        <a th:href="@{/fotos}"><i class="bi bi-camera"></i> Fotos</a>
        <a th:href="@{/extras}"><i class="bi bi-bag"></i> Extras - Productos</a>
        <a th:href="@{/extras/actividades}" class="ps-4">
            <i class="bi bi-calendar-event"></i> Extras - Actividades
        </a>

        <div class="section-title">Gastos y contabilidad</div>
        <a th:href="@{/gastos}"><i class="bi bi-receipt"></i> Gastos</a>
        <a th:href="@{/contabilidad}"><i class="bi bi-graph-up"></i> Contabilidad</a>

        <div class="section-title">Configuracion</div>
        <a th:href="@{/cursos}"><i class="bi bi-calendar-range"></i> Cursos</a>
        <a th:href="@{/ajustes}"><i class="bi bi-gear"></i> Ajustes</a>
        <a th:href="@{/perfil}"><i class="bi bi-person"></i> Mi perfil</a>
    </aside>

    <div class="top-bar d-flex justify-content-end align-items-center px-3 py-2">
        <span class="me-3 text-muted">
            <i class="bi bi-person-circle"></i>
            <span sec:authentication="name"></span>
        </span>
        <form th:action="@{/logout}" method="post" class="d-inline mb-0">
            <button type="submit" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesion
            </button>
        </form>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</div>
</body>
</html>
