<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Alumno')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>

<div class="p-4">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 th:text="${editando} ? 'Editar alumno' : 'Nuevo alumno'"></h2>
    <p class="text-muted">
        Socio: <strong th:text="${socio.nombre + ' ' + socio.apellidos}"></strong>
    </p>

    <form th:action="${editando} ? @{'/socios/' + ${socio.id} + '/alumnos/' + ${form.id} + '/editar'}
                                  : @{'/socios/' + ${socio.id} + '/alumnos/nuevo'}"
          th:object="${form}" method="post" class="mt-4" style="max-width: 900px;">

        <div class="card mb-3">
            <div class="card-header">Datos del alumno</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre *</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellidos *</label>
                        <input type="text" th:field="*{apellidos}" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Curso</label>
                        <input type="text" th:field="*{curso}" class="form-control" placeholder="Ej: 3A, 5 anos B, PLURI">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de nacimiento</label>
                        <input type="date" th:field="*{fechaNacimiento}" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Alergias</label>
                    <textarea th:field="*{alergias}" class="form-control" rows="2"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Observaciones medicas</label>
                    <textarea th:field="*{observacionesMedicas}" class="form-control" rows="2"></textarea>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Contactos de emergencia</div>
            <div class="card-body">
                <p class="text-muted small">Rellena al menos uno. Los huecos vacios se ignoran.</p>

                <div th:each="c, iter : *{contactos}" class="row mb-2 align-items-end">
                    <div class="col-md-1">
                        <label class="form-label small">#</label>
                        <input type="number" th:field="*{contactos[__${iter.index}__].orden}"
                               class="form-control form-control-sm" readonly>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Nombre</label>
                        <input type="text" th:field="*{contactos[__${iter.index}__].nombre}"
                               class="form-control form-control-sm">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Telefono</label>
                        <input type="text" th:field="*{contactos[__${iter.index}__].telefono}"
                               class="form-control form-control-sm">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Parentesco</label>
                        <input type="text" th:field="*{contactos[__${iter.index}__].parentesco}"
                               class="form-control form-control-sm" placeholder="Ej: madre, abuela...">
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> <span th:text="${editando} ? 'Guardar cambios' : 'Anadir alumno'"></span>
        </button>
        <a th:href="@{'/socios/' + ${socio.id}}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
