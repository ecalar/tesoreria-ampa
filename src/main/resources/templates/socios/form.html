<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Socio')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>

<div class="p-4">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 th:text="${editando} ? 'Editar socio' : 'Nuevo socio'"></h2>

    <form th:action="${editando} ? @{'/socios/' + ${form.id} + '/editar'} : @{/socios/nuevo}"
          th:object="${form}" method="post" class="mt-4" style="max-width: 900px;">

        <div class="card mb-3">
            <div class="card-header">Datos del socio</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre *</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellidos *</label>
                        <input type="text" th:field="*{apellidos}" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">DNI *</label>
                        <input type="text" th:field="*{dni}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Telefono</label>
                        <input type="text" th:field="*{telefono}" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email *</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Direccion</label>
                    <input type="text" th:field="*{direccion}" class="form-control">
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Cuota y permisos</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">N. de recibo</label>
                        <input type="text" th:field="*{numeroRecibo}" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Metodo de pago *</label>
                        <select th:field="*{metodoPago}" class="form-select" required>
                            <option th:each="m : ${metodos}" th:value="${m}" th:text="${m.name()}"></option>
                        </select>
                    </div>
                </div>
                <div class="form-check">
                    <input type="checkbox" th:field="*{permisoImagen}" class="form-check-input">
                    <label class="form-check-label">Autoriza el uso de imagenes de sus hijos</label>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> <span th:text="${editando} ? 'Guardar cambios' : 'Crear socio'"></span>
        </button>
        <a th:href="@{/socios}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
